[package]
name = "aether-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aether-kernel"
path = "src/main.rs"

[dependencies]
bootloader = "0.9"
x86_64 = "0.14"
# Uncomment as each driver is implemented:
# uart_16550 = "0.2"   # serial port driver
# pic8259 = "0.10"     # PIC interrupt controller
# pc-keyboard = "0.5"  # PS/2 keyboard decoder

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}"]
